<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Div</title>
        </head>

        <body>
            <style>
                .feedback {
                    border: 2px solid #ccc;
                    padding-top: 0px;
                    padding-bottom: 20px;
                    padding-left: 20px;
                    width: 300px;
                    margin-bottom: 20px;
                }

                button:hover {
                    background-color: #3367D6;
                }

                button:active {
                    border: 2px solid #3367D6;
                }

                .question {
                    font-family: Roboto;
                    font-weight: 550;
                }

                .youtube-music {
                    background-color: #1f1f1f;
                    max-width: 400px;
                    font-family: roboto;
                    padding: 20px 15px 20px 20px;
                    box-sizing: border-box;
                }

                .title {
                    color: white;
                    font-size: 28px;
                    font-weight: 700;
                    margin: 0px 0px 16px 0px;
                    letter-spacing: -0.5px;
                }

                .description {
                    color: #aaa;
                    font-size: 16px;
                    font-weight: 400;
                    margin: 0;
                }
            </style>
            <div class="feedback"> 
                <p class="question">Satisfies with our service?</p>
                <button class="yes-button">Yes</button>
                <button class="no-button">No</button> 
            </div>

            <div class = "youtube-music"> 
                <h1 class="title"> Install YouTube Music </h1>
                <p class="description"> Add YouTube Music to your desktop for quick and easy access. </p>
            </div>
        </body>
    </html>
