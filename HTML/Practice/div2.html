<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Div2</title>
        </head>

        <body>
            <style> 
                p {
                    font-family: Roboto;
                    margin-top: 0;
                    margin-bottom: 0;
                }

                .Profile-Image {
                    width: 200px;
                    object-fit: cover;
                    height: 200px;
                    margin-bottom: 5px;
                }

                .Profile {
                    width: 200px;
                    box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
                    display: inline-block;
                    margin-right: 15px;
                }

                .Name {
                    font-size: 18px;
                    font-weight: bold;
                    margin-left: 8px;
                    margin-bottom: 4px;
                }

                .Description {
                    color: rgb(100, 100, 100);
                    font-size: 14px;
                    margin-left: 8px;
                    margin-bottom: 4px;
                }

                .Add-Friend {
                    background-color: rgb(24, 119, 242);
                    font-size: 15px;
                    font-weight: bold;
                    color: white;
                    border: none;
                    border-radius: 4px;
                    padding: 10px 20px 10px 20px;
                    cursor: pointer;
                    margin-left: 8px;
                    margin-bottom: 10px;
                    transition: background-color 0.5s, opacity 0.3s;
                }

                .Add-Friend:hover {
                    background-color: rgb(24, 119, 242);
                    opacity: 0.8;
                }

                .Add-Friend:active {
                    background-color: rgb(24, 119, 242);
                    opacity: 0.6;
                }
            </style>
            <div class="Profile"> 
                <img class="Profile-Image" src="https://i.pinimg.com/736x/e0/e1/34/e0e13450d7e83bf3c47dae6394ca8347.jpg" alt="Profile Image" width="200px">
                <p class="Name"> Oliver</p>
                <p class="Description"> 2 mutuals friends </p>
                <button class="Add-Friend"> Add Friend </button>
            </div>    

            <div class="Profile"> 
                <img class="Profile-Image" src="https://i.pinimg.com/736x/b3/e7/ae/b3e7ae848a42b634bc31e229506f2f3c.jpg" alt="Profile Image" width="200px">
                <p class="Name"> Noah</p>
                <p class="Description"> 6 mutuals friends </p>
                <button class="Add-Friend"> Add Friend </button>
            </div>   

            <div class="Profile"> 
                <img class="Profile-Image" src="https://i.pinimg.com/736x/f0/1e/5e/f01e5ec13615dcce2cf7548ba99e52c0.jpg" alt="Profile Image" width="200px">
                <p class="Name"> Charlie</p>
                <p class="Description"> 10 mutuals friends </p>
                <button class="Add-Friend"> Add Friend </button>
            </div>   
        </body>
    </html>
