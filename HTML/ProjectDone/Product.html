<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Watch</title>

            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">

            <style> 
                * {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                }

                :root {
                --bg-page:      #f0f4f8;
                --bg-card:      #ffffff;
                --text-main:    #1a1a2e;
                --text-sub:     #666;
                --accent:       #6c63ff;
                --accent-hover: #574fd6;
                --badge-bg:     #f0eeff;
                --badge-text:   #6c63ff;
                --border:       #eee;
                --toggle-bg:    #ddd;
                }

                /* ── CSS Variables (Dark Mode) ── */
                body.dark {
                --bg-page:      #0f0f1a;
                --bg-card:      #1e1e2e;
                --text-main:    #f0f0f0;
                --text-sub:     #aaa;
                --accent:       #7c73ff;
                --accent-hover: #9a93ff;
                --badge-bg:     #2a2a3e;
                --badge-text:   #a89fff;
                --border:       #2e2e40;
                --toggle-bg:    #444;
                }
                
                body {
                    min-height: 100vh;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    background-color: var(--bg-page);
                    font-family: 'Segoe UI', sans-serif;
                    transition: background-color 0.3s;
                    gap: 24px;
                    }

                    /* ── Toggle Switch ── */
                    .toggle-wrapper {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    font-size: 14px;
                    color: var(--text-main);
                    transition: color 0.3s;
                    }

                    .toggle {
                    width: 48px;
                    height: 26px;
                    background-color: var(--toggle-bg);
                    border-radius: 999px;
                    position: relative;
                    cursor: pointer;
                    border: none;
                    transition: background-color 0.3s;
                    }

                    .toggle::after {
                    content: '';
                    position: absolute;
                    width: 20px;
                    height: 20px;
                    background: white;
                    border-radius: 50%;
                    top: 3px;
                    left: 3px;
                    transition: transform 0.3s;
                    }

                    body.dark .toggle { background-color: var(--accent); }
                    body.dark .toggle::after { transform: translateX(22px); }

                    /* ── Card ── */
                    .card {
                    background-color: var(--bg-card);
                    border-radius: 20px;
                    width: 300px;
                    overflow: hidden;
                    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
                    transition: background-color 0.3s, box-shadow 0.3s;
                    }

                    body.dark .card { box-shadow: 0 8px 24px rgba(0, 0, 0, 1); }

                    .card-image {
                    width: 100%;
                    height: 200px;
                    object-fit: cover;
                    display: block;
                    }

                    .card-body { padding: 20px; }

                    .badge {
                    display: inline-block;
                    font-size: 11px;
                    font-weight: 600;
                    padding: 4px 10px;
                    border-radius: 999px;
                    background-color: var(--badge-bg);
                    color: var(--badge-text);
                    margin-bottom: 10px;
                    transition: background-color 0.3s, color 0.3s;
                    }

                    .product-name {
                    font-size: 18px;
                    font-weight: 700;
                    color: var(--text-main);
                    margin-bottom: 6px;
                    transition: color 0.3s;
                    }

                    .product-desc {
                    font-size: 13px;
                    color: var(--text-sub);
                    line-height: 1.6;
                    margin-bottom: 16px;
                    transition: color 0.3s;
                    }

                    .card-footer {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    border-top: 1px solid var(--border);
                    padding-top: 16px;
                    transition: border-color 0.3s;
                    }

                    .price {
                    font-size: 22px;
                    font-weight: 700;
                    color: var(--accent);
                    transition: color 0.3s;
                    }

                    .add-btn {
                    padding: 10px 20px;
                    background-color: var(--accent);
                    color: #fff;
                    font-size: 13px;
                    font-weight: 600;
                    border: none;
                    border-radius: 30px;
                    cursor: pointer;
                    transition: background-color 0.2s, transform 0.1s;
                    }

                    .add-btn:hover {
                    background-color: var(--accent-hover);
                    transform: scale(1.04);
                    }

                    .add-btn:active { transform: scale(0.98); }


            </style>
        </head>

        <body>
            <div class="toggle-wrapper">
                <span>☀️ Light</span>
                <button class="toggle" id="darkToggle" aria-label="Toggle dark mode"></button>
                <span>🌙 Dark</span>
            </div>

            <div class="card">
                <img
                class="card-image"
                src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&q=80"
                alt="A premium watch"
                />
                <div class="card-body">
                <span class="badge">New Arrival</span>
                <p class="product-name">Premium Watch</p>
                <p class="product-desc">
                    Elegant design with a sapphire crystal face.
                    Water-resistant up to 50m. Perfect for everyday wear.
                </p>
                <div class="card-footer">
                    <span class="price">$129</span>
                    <button class="add-btn">Add to Cart</button>
                </div>
                </div>
            </div>

            <script>
                const toggle = document.getElementById('darkToggle');
                toggle.addEventListener('click', () => {
                document.body.classList.toggle('dark');
                });
            </script>
        </body>
    </html>
